<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jewett Lab Academic Family Tree</title>
<link rel="stylesheet" href="styles.css">
<script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
<header id="app-header">
  <div id="header-title">
    <h1>Academic Family Tree</h1>
    <span id="header-subtitle"></span>
  </div>
  <div id="toolbar">
    <div id="search-box">
      <input id="search-input" type="text" placeholder="Search by name..." autocomplete="off">
      <div id="search-results" class="hidden"></div>
    </div>
    <div id="orientation-group" class="btn-group">
      <button type="button" data-orientation="landscape" title="Generations flow left to right">Landscape</button>
      <button type="button" data-orientation="portrait" title="Generations flow top to bottom">Portrait</button>
      <button type="button" data-orientation="fan" title="Radial fan layout">Fan</button>
    </div>
    <button id="filter-toggle" class="toolbar-btn" type="button">Filters</button>
    <button id="expand-all" class="toolbar-btn" type="button">Expand All</button>
    <button id="reset-view" class="toolbar-btn" type="button">Show Full Tree</button>
    <button id="upload-btn" class="toolbar-btn" type="button">Upload JSON...</button>
    <input id="upload-input" type="file" accept=".json,application/json" hidden>
    <button id="print-btn" class="toolbar-btn" type="button">Print...</button>
  </div>
</header>

<div id="filter-panel" class="hidden">
  <div id="filter-list"></div>
  <div id="filter-actions">
    <button id="filter-all" class="link-btn" type="button">Select all</button>
    <button id="filter-none" class="link-btn" type="button">Select none</button>
  </div>
</div>

<div id="breadcrumb" class="hidden"></div>

<main id="tree-container">
  <svg id="tree-svg"></svg>
  <div id="empty-state" class="hidden">No individuals match the current filters.</div>
  <div id="zoom-controls">
    <button id="zoom-in" type="button" title="Zoom in">+</button>
    <button id="zoom-out" type="button" title="Zoom out">&minus;</button>
    <button id="zoom-fit" type="button" title="Fit to screen">&#9678;</button>
  </div>
</main>

<aside id="detail-panel" class="hidden">
  <button id="detail-close" type="button" aria-label="Close">&times;</button>
  <div id="detail-content"></div>
</aside>

<div id="print-modal-overlay" class="hidden">
  <div id="print-modal">
    <button id="print-modal-close" type="button" aria-label="Close">&times;</button>
    <h2>Print current view</h2>

    <div class="print-field">
      <label for="print-paper-preset">Paper size</label>
      <select id="print-paper-preset">
        <option value="letter">Letter (8.5 × 11 in)</option>
        <option value="legal">Legal (8.5 × 14 in)</option>
        <option value="tabloid">Tabloid (11 × 17 in)</option>
        <option value="a4">A4 (210 × 297 mm)</option>
        <option value="a3">A3 (297 × 420 mm)</option>
        <option value="custom">Custom...</option>
      </select>
    </div>

    <div id="print-custom-size" class="print-field hidden">
      <label>Custom dimensions</label>
      <div class="print-custom-row">
        <input id="print-custom-width" type="number" min="1" step="0.1" value="8.5">
        <span>×</span>
        <input id="print-custom-height" type="number" min="1" step="0.1" value="11">
        <select id="print-custom-unit">
          <option value="in">in</option>
          <option value="mm">mm</option>
        </select>
      </div>
    </div>

    <div class="print-field">
      <label>Paper orientation</label>
      <div class="btn-group print-radio-group" id="print-paper-orientation">
        <button type="button" data-value="portrait" class="active">Portrait</button>
        <button type="button" data-value="landscape">Landscape</button>
      </div>
    </div>

    <div class="print-field">
      <label>Tree layout</label>
      <div class="btn-group print-radio-group" id="print-tree-orientation">
        <button type="button" data-value="auto" class="active">Auto (match paper)</button>
        <button type="button" data-value="landscape">Landscape</button>
        <button type="button" data-value="portrait">Portrait</button>
      </div>
    </div>

    <div class="print-field">
      <label>Fit</label>
      <div class="btn-group print-radio-group" id="print-fit-mode">
        <button type="button" data-value="tile" class="active">Tile across pages (legible)</button>
        <button type="button" data-value="single">Shrink to one page</button>
      </div>
    </div>

    <div id="print-zoom-field" class="print-field">
      <label for="print-zoom">Zoom <span id="print-zoom-value">100%</span></label>
      <input id="print-zoom" type="range" min="25" max="150" step="5" value="100">
    </div>

    <label class="print-checkbox-field">
      <input id="print-expand-all" type="checkbox" checked>
      Expand all collapsed groups for printing
    </label>

    <div id="print-summary" class="print-summary"></div>

    <div class="print-actions">
      <button id="print-cancel" class="link-btn" type="button">Cancel</button>
      <button id="print-go" class="toolbar-btn print-go-btn" type="button">Print</button>
    </div>
  </div>
</div>

<style id="print-page-style"></style>
<div id="print-root"></div>

<script src="app.js?v=6"></script>
</body>
</html>
